name: B4V3 每日信号更新

on:
  schedule:
    # 北京时间 21:00（UTC 13:00）运行
    # 经实测 cnindex 官网当日指数约在 20:30(北京)才发布；16:30 跑会拿不到当日数据，
    # 故排到发布之后，确保当天即能取到最新指数
    - cron: '0 13 * * 1-5'
  workflow_dispatch:  # 手动触发
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pandaai-signal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 恢复指数数据缓存
        uses: actions/cache@v4
        with:
          path: signal_page_b4/data
          # key采用稳定版本号(而非hashFiles(代码))，避免每次改代码缓存失效触发全量重拉(接口繁忙风险)
          key: index-cache-v2
          restore-keys: |
            index-cache-

      - name: 安装依赖
        run: |
          pip install requests pandas numpy matplotlib
          # GitHub Runner(Ubuntu)无中文字体，安装Noto CJK避免图表中文乱码；
          # 每次构建均为全新环境、无matplotlib字体缓存，generate.py首次运行会自动扫描到该字体
          sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: 生成B4V3信号页面
        run: python signal_page_b4/generate.py

      - name: 上传 Pages 制品
        uses: actions/upload-pages-artifact@v3
        with:
          path: signal_page_b4/docs

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
