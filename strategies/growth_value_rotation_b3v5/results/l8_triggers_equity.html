      axisPointer: { type: 'cross' },
      backgroundColor: 'rgba(22, 33, 62, 0.9)',
      borderColor: '#0f3460',
      textStyle: { color: '#e0e0e0', fontSize: 12 },
      formatter: function(params) {
        var s = '<b>' + params[0].axisValue + '</b><br/>';
        params.forEach(function(p) {
          if (p.seriesName !== 'L8触发' && p.seriesName !== '成长解锁' && p.seriesName !== '价值解锁') {
            var val = typeof p.value === 'number' ? p.value.toFixed(4) : p.value;
            s += p.marker + ' ' + p.seriesName + ': ' + val + '<br/>';
          }
        });
        var idx = triggerDates.indexOf(params[0].axisValue);
        if (idx >= 0) {
          s += '<br/><b style="color:#ff3333;">⚡ L8触发 #' + (idx+1) + '</b><br/>';
          s += '  成长5日: ' + '<br/>';
          s += '  价值5日: ' + '<br/>';
          if (triggerUnlockRecords[idx] && triggerUnlockRecords[idx].length > 0) {
            s += '<br/><b>解锁记录:</b><br/>';
            triggerUnlockRecords[idx].forEach(function(rec) {
              var color = rec.dir === 'growth' ? '#ff922b' : '#51cf66';
              s += '<span style="color:' + color + ';">●</span> ' + rec.date + ' → ' + rec.reason + '<br/>';
            });
          }
        }
        return s;
      }
    },
    legend: {
      data: ['净值', '成长100', '价值100', 'L8触发', '成长解锁', '价值解锁'],
      textStyle: { color: '#888' },
      top: 5,
    },
    grid: { left: '5%', right: '5%', bottom: '8%', top: '12%' },
    xAxis: {
      type: 'category',
      data: dates,
      axisLabel: { color: '#666', fontSize: 10, interval: 60 },
      axisLine: { lineStyle: { color: '#333' } },
    },
    yAxis: [
      { type: 'value', name: '净值', nameTextStyle: { color: '#888' }, axisLabel: { color: '#888' }, splitLine: { lineStyle: { color: '#222', type: 'dashed' } }, scale: true },
      { type: 'value', name: '指数', nameTextStyle: { color: '#888' }, axisLabel: { color: '#888' }, splitLine: { show: false }, scale: true }
    ],
    dataZoom: [
      { type: 'inside', start: 0, end: 100 },
      { type: 'slider', start: 0, end: 100, height: 20, bottom: 0, borderColor: '#333', backgroundColor: '#1a1a2e', fillerColor: 'rgba(0, 212, 255, 0.1)', textStyle: { color: '#888' } }
    ],
    series: [
      {
        name: '净值', type: 'line', data: nav, smooth: true, symbol: 'none',
        lineStyle: { width: 2, color: '#ffd700' },
        areaStyle: { color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
          { offset: 0, color: 'rgba(255, 215, 0, 0.15)' },
          { offset: 1, color: 'rgba(255, 215, 0, 0.01)' }
        ]) },
        yAxisIndex: 0,
      },
      {
        name: '成长100', type: 'line', data: gClose, smooth: true, symbol: 'none',
        lineStyle: { width: 1, color: '#4dabf7', opacity: 0.5 }, yAxisIndex: 1,
      },
      {
        name: '价值100', type: 'line', data: vClose, smooth: true, symbol: 'none',
        lineStyle: { width: 1, color: '#da77f2', opacity: 0.5 }, yAxisIndex: 1,
      },
      {
        name: 'L8触发', type: 'scatter',
        data: triggerDates.map(function(d, i) { var idx = dates.indexOf(d); return [idx, triggerNavs[i]]; }),
        symbol: 'pin', symbolSize: 35,
        itemStyle: { color: '#ff3333', opacity: 0.8 },
        label: { show: true, formatter: '⚠', color: '#fff', fontSize: 14 },
        tooltip: { formatter: function(p) { var date = dates[Math.round(p.data[0])]; var ti = triggerDates.indexOf(date); var s = '<b style="color:#ff3333;">⚡ L8触发 #' + (ti+1) + '</b><br/>日期: ' + date + '<br/>净值: ' + p.data[1].toFixed(4); if (triggerUnlockRecords[ti] && triggerUnlockRecords[ti].length > 0) { s += '<br/><b>解锁记录:</b>'; triggerUnlockRecords[ti].forEach(function(rec) { s += '<br/><span style="color:' + (rec.dir==='growth'?'#ff922b':'#51cf66') + ';">●</span> ' + rec.date + ' → ' + rec.reason; }); } return s; } }
      },
      {
        name: '成长解锁', type: 'scatter',
        data: growthUnlockList.map(function(item) { var idx = dates.indexOf(item.date); return idx >= 0 ? [idx, item.nav] : null; }).filter(Boolean),
        symbol: 'diamond', symbolSize: 14,
        itemStyle: { color: '#ff922b', opacity: 0.8 },
        label: { show: true, formatter: '成', color: '#ff922b', fontSize: 10, fontWeight: 'bold' },
        tooltip: { formatter: function(p) { var date = dates[Math.round(p.data[0])]; var item = growthUnlockList.find(function(x) { return x.date === date; }); return '<b style="color:#ff922b;">🔓 成长解锁</b><br/>日期: ' + date + '<br/>净值: ' + p.data[1].toFixed(4) + '<br/>原因: ' + (item ? item.reason : ''); } }
      },
      {
        name: '价值解锁', type: 'scatter',
        data: valueUnlockList.map(function(item) { var idx = dates.indexOf(item.date); return idx >= 0 ? [idx, item.nav] : null; }).filter(Boolean),
        symbol: 'diamond', symbolSize: 14,
        itemStyle: { color: '#51cf66', opacity: 0.8 },
        label: { show: true, formatter: '价', color: '#51cf66', fontSize: 10, fontWeight: 'bold' },
        tooltip: { formatter: function(p) { var date = dates[Math.round(p.data[0])]; var item = valueUnlockList.find(function(x) { return x.date === date; }); return '<b style="color:#51cf66;">🔓 价值解锁</b><br/>日期: ' + date + '<br/>净值: ' + p.data[1].toFixed(4) + '<br/>原因: ' + (item ? item.reason : ''); } }
      }
    ]
  };

  chart.setOption(option);
  window.addEventListener('resize', function() { chart.resize(); });
</script>
</body>
</html>
